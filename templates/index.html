        * {

            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #fff;
        }
        .main-wrapper {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .video-section {
            flex: 1;
            min-width: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #video {
            width: 100%;
            display: block;
            background: #000;
        }
        .info-bar {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        #userCount {
            font-size: 14px;
            color: #a0a0a0;
        }
        #hostBadge {
            font-size: 12px;
            padding: 4px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            color: #fff;
            font-weight: 500;
        }
        #hostBadge.hidden {
            display: none;
        }
        
        /* 聊天面板样式 */
        .chat-section {
            width: 350px;
            flex-shrink: 0;
        }
        .chat-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-title::before {
            content: '💬';
        }
        .chat-toggle {
            background: none;
            border: none;
            color: #a0a0a0;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.2s;
        }
        .chat-toggle:hover {
            color: #fff;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-message {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .chat-username {
            color: #667eea;
            font-weight: 500;
        }
        .chat-time {
            color: #666;
        }
        .chat-bubble {
            background: rgba(102, 126, 234, 0.2);
            padding: 10px 14px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }
        .chat-bubble img {
            height: 24px;
            width: auto;
            vertical-align: middle;
        }
        .chat-input-area {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 100px;
        }
        .chat-input:focus {
            border-color: #667eea;
        }
        .chat-tools {
            display: flex;
            gap: 8px;
        }
        .chat-tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #a0a0a0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .chat-tool-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            color: #fff;
        }
        .chat-send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .chat-send-btn:hover {
            transform: scale(1.05);
        }
        
        /* 表情面板 */
        .emoji-panel {
            position: absolute;
            bottom: 70px;
            right: 20px;
            width: 320px;
            max-height: 400px;
            background: rgba(30, 30, 50, 0.98);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .emoji-panel.active {
            display: flex;
        }
        .emoji-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .emoji-tabs {
            display: flex;
            gap: 8px;
        }
        .emoji-tab {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #888;
        }
        .emoji-tab.active {
            background: rgba(102, 126, 234, 0.3);
            color: #fff;
        }
        .emoji-close {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            padding: 10px;
            overflow-y: auto;
            max-height: 300px;
        }
        .emoji-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 20px;
        }
        .emoji-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }
        .emoji-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        
        /* 折叠状态 */
        .chat-section.collapsed .chat-container {
            height: auto;
        }
        .chat-section.collapsed .chat-messages,
        .chat-section.collapsed .chat-input-area {
            display: none;
        }
        
        /* 系统消息 */
        .system-message {
            text-align: center;
            color: #888;
            font-size: 12px;
            padding: 8px;
        }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
            }
            .chat-section {
                width: 100%;
            }
            .chat-container {
                height: 400px;
            }
        }
    </style>

        // 初始化表情面板
        function initEmojiPanel() {
            const emojiGrid = document.getElementById('emojiGrid');
            qqEmojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'emoji-item';
                btn.setAttribute('data-name', emoji.name);
                btn.innerHTML = `<img src="${emoji.url}" alt="${emoji.name}" loading="lazy">`;
                btn.addEventListener('click', () => insertEmoji(emoji));
                emojiGrid.appendChild(btn);
            });
        }
        
        // 插入表情到输入框
        function insertEmoji(emoji) {
            const input = document.getElementById('chatInput');
            input.value += emoji.name;
            input.focus();
        }
        
        // 表情面板切换
        document.getElementById('emojiBtn').addEventListener('click', () => {
            document.getElementById('emojiPanel').classList.toggle('active');
        });
        
        document.getElementById('emojiClose').addEventListener('click', () => {
            document.getElementById('emojiPanel').classList.remove('active');
        });
        
        // 聊天面板折叠
        let isChatCollapsed = false;
        document.getElementById('chatToggle').addEventListener('click', function() {
            const chatSection = document.getElementById('chatSection');
            isChatCollapsed = !isChatCollapsed;
            chatSection.classList.toggle('collapsed', isChatCollapsed);
            this.textContent = isChatCollapsed ? '+' : '−';
        });
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            socket.emit('chat_message', {
                room: room,
                username: username,
                message: message,
                timestamp: new Date().toISOString()
            });
            
            input.value = '';
            document.getElementById('emojiPanel').classList.remove('active');
        }
        
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // 添加消息到聊天区
        function addMessage(data, isSelf = false) {
            const messagesDiv = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message';
            
            const time = new Date(data.timestamp).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
            
            // 转换表情代码为图片
            let messageHtml = data.message.replace(/\/(\S+)/g, (match, name) => {
                const emoji = qqEmojis.find(e => e.name === '/' + name);
                if (emoji) {
                    return `<img src="${emoji.url}" alt="${emoji.name}" style="height:24px;width:auto;vertical-align:middle;">`;
                }
                return match;
            });
            
            msgDiv.innerHTML = `
                <div class="chat-message-header">
                    <span class="chat-username">${isSelf ? '我' : data.username}</span>
                    <span class="chat-time">${time}</span>
                </div>
                <div class="chat-bubble" style="${isSelf ? 'background: rgba(118, 75, 162, 0.3);' : ''}">${messageHtml}</div>
            `;
            
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // 设置视频
        const videoSrc = '{{ video_url }}';
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
        
        // Socket 事件
        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('join', {room: room});
        });
        
        socket.on('connect_error', (error) => {
            console.error('Connection error:', error);
        });
        
        socket.on('user_joined', (data) => {
            userCount.textContent = `在线用户: ${data.count}`;
            isHost = data.is_host;
            
            if (isHost) {
                hostBadge.classList.remove('hidden');
                addMessage({
                    username: '系统',
                    message: '你是房主，你的播放进度会同步给其他用户',
                    timestamp: new Date().toISOString()
                });
            } else {
                hostBadge.classList.add('hidden');
                // 非房主，同步到房主状态
                if (data.host_state) {
                    video.currentTime = data.host_state.time;
                    if (data.host_state.playing) {
                        video.play();
                    } else {
                        video.pause();
                    }
                }
                addMessage({
                    username: '系统',
                    message: '已加入房间，正在同步房主进度...',
                    timestamp: new Date().toISOString()
                });
            }
        });
        
        socket.on('user_joined_broadcast', (data) => {
            userCount.textContent = `在线用户: ${data.count}`;
        });
        
        socket.on('user_left', (data) => {
            userCount.textContent = `在线用户: ${data.count}`;
        });
        
        socket.on('new_host', (data) => {
            isHost = data.is_host;
            if (isHost) {
                hostBadge.classList.remove('hidden');
                addMessage({
                    username: '系统',
                    message: '原房主已离开，你已成为新房主',
                    timestamp: new Date().toISOString()
                });
            }
        });
        
        // 只有非房主才接收同步指令
        socket.on('sync', (data) => {
            if (!isHost) {
                const timeDiff = Math.abs(video.currentTime - data.time);
                if (timeDiff > SYNC_THRESHOLD) {
                    video.currentTime = data.time;
                }
                if (data.playing && video.paused) {
                    video.play();
                } else if (!data.playing && !video.paused) {
                    video.pause();
                }
            }
        });
        
        // 接收聊天消息
        socket.on('chat_message', (data) => {
            addMessage(data, data.username === username);
        });
        
        // 房主发送同步事件
        if (isHost) {
            video.addEventListener('play', () => {
                socket.emit('sync', {room: room, time: video.currentTime, playing: true});
            });
            
            video.addEventListener('pause', () => {
                socket.emit('sync', {room: room, time: video.currentTime, playing: false});
            });
            
            video.addEventListener('seeked', () => {
                socket.emit('sync', {room: room, time: video.currentTime, playing: !video.paused});
            });
            
            // 每3秒同步一次进度
            setInterval(() => {
                if (!video.paused) {
                    socket.emit('sync', {room: room, time: video.currentTime, playing: true});
                }
            }, 3000);
        }
        
        // 初始化
        initEmojiPanel();
    </script>
